spring.application.name=gestao-frota

# Perfil ativo: use "casa" ou "flash"
spring.profiles.active=casa

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Envio de e-mail (redefinicao de senha).
# As credenciais vem de variaveis de ambiente para nao irem para o git.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remetente exibido nos e-mails enviados pelo sistema
app.mail.remetente=${MAIL_FROM:nao-responda@gestaofrota.com}

# Validade do codigo de redefinicao de senha, em minutos
app.recuperacao.validade-minutos=15
# Tentativas erradas permitidas antes de invalidar o codigo
app.recuperacao.max-tentativas=5
# Intervalo minimo entre dois pedidos de codigo, em segundos
app.recuperacao.intervalo-reenvio-segundos=30

# Usuario administrador garantido a cada inicializacao.
# Defina ADMIN_SENHA como variavel de ambiente antes de publicar.
app.admin.email=${ADMIN_EMAIL:admin@frotasystem.com}
app.admin.senha=${ADMIN_SENHA:admin123}

# JWT. O segredo precisa de 32+ caracteres; defina JWT_SECRET antes de publicar.
app.jwt.segredo=${JWT_SECRET:troque-este-segredo-de-desenvolvimento-32chars}
app.jwt.access-validade-minutos=15
app.jwt.refresh-validade-dias=7

# Broker MQTT. Em producao o Mosquitto roda na propria VM, entao localhost.
# Em desenvolvimento, sem as variaveis, cai no broker publico de teste.
app.mqtt.broker=${MQTT_BROKER:tcp://broker.emqx.io:1883}
app.mqtt.usuario=${MQTT_USER:}
app.mqtt.senha=${MQTT_PASSWORD:}
