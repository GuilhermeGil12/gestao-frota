# Perfil de producao (VM Azure). Nenhuma credencial fica neste arquivo:
# tudo vem de variaveis de ambiente definidas no servico systemd.
spring.datasource.url=jdbc:postgresql://localhost:5432/gestao_frota
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# update cria as tabelas que faltam. Depois do primeiro boot, trocar por
# validate para que o Hibernate nunca mais altere o schema sozinho.
spring.jpa.hibernate.ddl-auto=update

server.port=8080

# Em producao o erro detalhado fica no log, nao na resposta HTTP.
server.error.include-message=never
server.error.include-stacktrace=never
